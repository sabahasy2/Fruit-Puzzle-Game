name: Validate Fruit Pop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game and helper JavaScript syntax
        run: |
          node --check sw.js
          node --check assets/game.js
          node --check assets/fruit-renderer.js
          node --check assets/world-catalog.js
          node --check assets/account-sync.js
          node --check assets/life-recovery.js
          node --input-type=module --check < 'functions/api/[[path]].js'
