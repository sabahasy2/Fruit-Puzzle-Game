name: Validate Fruit Pop

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/deploy-pages.yml"
      - "icon.svg"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release smoke tests
        run: node --test tests/smoke.test.mjs
